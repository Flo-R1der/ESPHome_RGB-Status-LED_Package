##### LED EFFECT HANDLER #####
# This script is called by the working status scripts to set the desired effect
# with the correct lengt and brightness.
  - id: system_status_led_effect_handler
    parameters:
      effect: string
      red: float
      green: float
      blue: float
    then:
      - globals.set:
          id: system_status_led_effect_length
          value: !lambda |-
            if (effect == "none") {
              return 0;
            } else if (effect == "Fast Pulse") {
              return ${length_fast_pulse};
            } else if (effect == "Slow Pulse") {
              return ${length_slow_pulse};
            } else if (effect == "Breath") {
              return ${length_breath};
            } else {
              return 1000;
            }
      - logger.log:
          format: "Setting LED effect to \"%s\" with length: %dms (%.0f%% brightness)"
          args: ['effect.c_str()', 'id(system_status_led_effect_length)', 'id(system_status_led_brightness)']
          level: INFO
      - light.turn_on:
          id: system_status_led
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          effect: "Pulse"
          brightness: !lambda 'return id(system_status_led_brightness);'
      - delay: 100ms
      # - lambda: |-
      #     std::string effectName = id(system_status_led).get_effect_name();
      #     ESP_LOGI("system_status_led", "Current detected effect name: %s", effectName.c_str());
      - if:
          condition:
            lambda: |-
              return id(system_status_led).get_effect_name() != "Pulse";
          then:
            - lambda: |-
                ESP_LOGW("system_status_led", "New flexible effect seems to be missing? Trying to use the legacy effects.");
                ESP_LOGW("system_status_led", "Please update your Status-LED settings in your project!");
                ESP_LOGW("system_status_led", "Details here: https://github.com/Flo-R1der/ESPHome_RGB-Status-LED_Package");
            - light.turn_on:
                id: system_status_led
                red: !lambda 'return red;'
                green: !lambda 'return green;'
                blue: !lambda 'return blue;'
                effect: !lambda 'return effect;'
                brightness: !lambda 'return id(system_status_led_brightness);'
