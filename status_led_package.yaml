##### GLOBAL DEFINITIONS AND SUBSTITUTIONS #####
globals:
  - id: boot_done
    type: bool
    initial_value: "false"
  - id: wifi_ok
    type: bool
    initial_value: "false"
  - id: api_ok
    type: bool
    initial_value: "false"

substitutions:
  system_status_led_id: "system_status_led"   # Default
  system_status_led_brightness: "50%"         # Default
  blink_on_off_time: "200ms"                  # Default



##### CATCH SYSTEM EVENTS #####
# boot priority values: https://esphome.io/components/esphome/#configuration-variables-1
esphome:
  on_boot:
    - priority: 700
      then:
        - script.execute: led_system_status
    - priority: -10
      then:
        - delay: 500ms
          # depending on your board, the red LED may light up so shortly that you don't see it
          # this delay ensures the red light comes up and you can recognize boot-loop issues
        - lambda: 'id(boot_done) = true;'
        - script.execute: led_system_status

wifi:
  on_connect:
    then:
      - lambda: 'id(wifi_ok) = true;'
      - script.execute: led_system_status
  on_disconnect:
    then:
      - lambda: 'id(wifi_ok) = false;'
      - script.execute: led_system_status

api:
  on_client_connected:
    then:
      - lambda: 'id(api_ok) = true;'
      - script.execute: led_system_status
  on_client_disconnected:
    then:
      - lambda: 'id(api_ok) = false;'
      - script.execute: led_system_status


##### ASSIGN COLORS TO LED #####
script:
  - id: led_system_status
    mode: restart
    then:
      # API CONNECTED (Priority 4) - green (steady)
      - if:
          condition:
            lambda: 'return id(api_ok);'
          then:
            - light.turn_on:
                id: ${system_status_led_id}
                red: 0%
                green: 100%
                blue: 10%
                brightness: ${system_status_led_brightness}
                effect: none
            - script.stop:
                id: led_system_status

      # WIFI OK (Priority 3) - white (steady)
      - if:
          condition:
            lambda: 'return id(wifi_ok);'
          then:
            - light.turn_on:
                id: ${system_status_led_id}
                red: 70%
                green: 70%
                blue: 70%
                brightness: ${system_status_led_brightness}
                effect: none
            - script.stop:
                id: led_system_status

      # BOOT DONE (Priority 2) - yellow (steady)
      - if:
          condition:
            lambda: 'return id(boot_done);'
          then:
            - light.turn_on:
                id: ${system_status_led_id}
                red: 80%
                green: 80%
                blue: 0
                brightness: 50%
                effect: none
            - script.stop:
                id: led_system_status

      # BOOTING (Priority 1) - red (steady)
      - light.turn_on:
          id: ${system_status_led_id}
          red: 100%
          green: 0
          blue: 0
          brightness: 50%
          effect: none



##### ADDITIONAL WORKING MODES #####
# will not end automatically / can be overridden by system status script.
  - id: led_working_status_blue
    parameters:
      effect: string 
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 0%
          green: 0%
          blue: 100%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'
  - id: led_working_status_1  # LEGACY ALIAS → led_working_status_blue
    then:
      - script.execute: 
          id: led_working_status_blue
          effect: "Slow Pulse"

  - id: led_working_status_purple
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 80%
          green: 0%
          blue: 80%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'
  - id: led_working_status_2  # LEGACY ALIAS → led_working_status_purple
    then:
      - script.execute:
          id: led_working_status_purple
          effect: "Slow Pulse"

  - id: led_working_status_red
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 100%
          green: 0%
          blue: 0%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'

  - id: led_working_status_orange
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 100%
          green: 50%
          blue: 0%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'

  - id: led_working_status_yellow
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 80%
          green: 80%
          blue: 0%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'

  - id: led_working_status_green
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 0%
          green: 100%
          blue: 0%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'

  - id: led_working_status_cyan
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 0%
          green: 100%
          blue: 100%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'

  - id: led_working_status_white
    parameters:
      effect: string
    then:
      - light.turn_on:
          id: ${system_status_led_id}
          red: 70%
          green: 70%
          blue: 70%
          brightness: ${system_status_led_brightness}
          effect: !lambda 'return effect;'


##### SHORT FEEDBACK MODES #####
# will end automatically and return to the LED system status.
  - id: led_feedback_blink_blue
    parameters:
      count: int
    then:
      - repeat:
          count: !lambda 'return count;'
          then:
            - light.turn_on:
                id: ${system_status_led_id}
                red: 0%
                green: 0%
                blue: 100%
                brightness: ${system_status_led_brightness}
